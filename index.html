<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-verde">
        <!-- Cabeçalho -->
        <header>
            <!--container-->
            <div class="container">
                <nav>
                    <div class="logo">
                        <a href="index.html">SPAA</a>
                    </div>
                    <ul class="ul">
                        <li> <a href="#">Home   </a></li>
                        <li> <a href="#">Transparência</a></li>
                        <li> <a href="#">FAQ</a></li>
                        <li> <a href="#">Blog</a></li>
                        <li><a href="#"><button class="btn-gradiente"> Quero adotar</button></a></li>
                    </ul>
                    <div class="menu-icon">
                        <img src="./img/menu.png" alt="icone de menu">
                    </div>
                </nav>
            </div>
            <!-- fim container-->
        </header>
        <!--fim cabeçalho-->

        <!--inicio main-->
        <main>
            <!-- inicio container-->
            <div class="container">
                <!--inicio main-text-->
                <div class="main-text">
                    <h1>você pode se
                        apaixonar agora
                        por um pet!
                    </h1>
                    <div>
                        <button class="btn-gradiente">Buscar um pet</button>
                    </div>
                </div>
                <!--fim main-text-->

                <!--inicio main-image-->
                <div class="main-image">
                    <img src="./img/imagem-animais-banner.png" alt="cachorro e gato filhotes">
                </div>
                <!--inicio main-image-->

            </div>
            <!-- fim container-->
        </main>
        <!--fim main-->
    </div>
    <!--fim do banner (fundo verde)-->

    <!--inicio resultados (faixa laranja)-->

    <!--inicio resultados (faixa laranja)-->
    <section class="resultados">
        <!--Inicio Container-->
        <div class="container">
            <div class="resultados-text">
                Transformando vidas e unindo famílias
                por meio da adoção.
            </div>

            <div class="resultados-numero">
                <p>
                    <span>+10 mil</span> <br>
                    Vidas Resgatadas
                </p>

                <p>
                    <span>+2 mil</span> <br>
                    Animais doados
                </p>

                <p>
                    <span>+1 mil</span> <br>
                    Animais castrados
                </p>
            </div>
        </div>
        <!--Fim Container-->
    </section>
    <!--Fim resultados (faixa laranja)-->


    <script src="./js/main.js"></script>
</body>

</html>
